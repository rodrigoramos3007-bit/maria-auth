<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gravar DESK">
<meta name="theme-color" content="#0f172a">
<title>Gravar | DESK AllBridge</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px)}
  h1{font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  h1 small{font-weight:400;color:var(--mut);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
  select,input,textarea{width:100%;background:#0b1222;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
  textarea{min-height:70px;resize:vertical}
  button{border:0;border-radius:12px;font-size:16px;font-weight:600;color:#fff;padding:12px;cursor:pointer}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .big button{padding:22px 8px;font-size:18px}
  #btnRec{background:var(--red)} #btnRec.on{background:#7f1d1d;animation:p 1.6s infinite}
  @keyframes p{50%{box-shadow:0 0 0 8px rgba(239,68,68,.25)}}
  #btnFoto{background:var(--blue)}
  .sec{background:#475569}.ok{background:var(--green)}
  #live{min-height:90px;max-height:220px;overflow:auto;font-size:15px;white-space:pre-wrap}
  #live .int{color:var(--mut)}
  .st{font-size:13px;color:var(--mut);margin-top:6px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#0b1222;border:1px solid var(--line);font-size:12px;margin:2px 4px 2px 0}
  .warn{color:var(--amber)} .err{color:var(--red)} .good{color:var(--green)}
  #thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  #thumbs div{position:relative}
  #thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
  #thumbs div.done img{border-color:var(--green)} #thumbs div.fail img{border-color:var(--red)}
  .hide{display:none!important}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);background:#020617;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1}

  #cam{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
  #cam video{flex:1;width:100%;object-fit:contain;background:#000}
  #camBar{padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;align-items:center;background:#020617}
  #camBar button{flex:1;padding:18px 8px;font-size:18px}
  #btnCapturar{background:var(--blue)} #btnFecharCam{background:#475569;flex:.6!important}
  #camTopo{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;font-size:14px}
  #camTopo span{background:rgba(2,6,23,.75);padding:6px 10px;border-radius:99px}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60;transition:opacity .25s}
</style>
</head>
<body>
<h1>🎙 Gravar no DESK <small id="net">…</small></h1>

<div id="semChave" class="card hide">
  <b>Chave não encontrada.</b>
  <p class="st">Abra este app pelo link com a chave que o Claude te mandou. Ele fica salvo neste celular.</p>
</div>

<div id="app" class="hide">
  <div class="card">
    <label>Palestra / assunto</label>
    <select id="selSessao"></select>
    <div id="novaBox" class="hide" style="margin-top:8px">
      <input id="novoAssunto" placeholder="Ex: Apresentação da Corebridge" style="margin-bottom:6px">
      <input id="novoPalestrante" placeholder="Palestrante (opcional)" style="margin-bottom:6px">
      <input id="novoEvento" placeholder="Evento" style="margin-bottom:6px">
      <div class="row"><button class="sec" id="btnCancelNova">Cancelar</button><button class="ok" id="btnCriar">Criar</button></div>
    </div>
  </div>

  <div class="big">
    <button id="btnRec">● Gravar</button>
    <button id="btnFoto">📷 Foto</button>
  </div>
  <input type="file" id="inFoto" accept="image/*" capture="environment" class="hide">
  <input type="file" id="inGaleria" accept="image/*" multiple class="hide">

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <label style="margin:0">Transcrição (chega a cada 1 min)</label>
      <select id="selLang" style="width:auto;padding:4px 8px;font-size:13px">
        <option value="en-US">Inglês</option><option value="pt-BR">Português</option><option value="es-US">Espanhol</option>
      </select>
    </div>
    <div id="live"><span class="st">Toque em Gravar. A tela fica ligada enquanto grava.</span></div>
    <div class="st" id="stRec"></div>
  </div>

  <div class="card">
    <label>Nota rápida</label>
    <textarea id="txtNota" placeholder="Algo importante que você quer guardar"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="sec" id="btnNota">Salvar nota</button>
      <button style="background:var(--amber)" id="btnNotaImp">⭐ Importante</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label style="margin:0">Fotos desta palestra</label>
      <button class="sec" id="btnGaleria" style="padding:6px 10px;font-size:13px">Da galeria</button>
    </div>
    <div id="thumbs"></div>
    <div class="st" id="stFila"></div>
  </div>
</div>
<div id="cam" class="hide">
  <video id="camVideo" playsinline muted autoplay></video>
  <div id="camTopo"><span id="camRec">…</span><span id="camCont">0 fotos</span></div>
  <div id="camBar"><button id="btnFecharCam">Fechar</button><button id="btnCapturar">📸 Capturar</button></div>
</div>
<div id="flash"></div>
<div id="toast"></div>

<script>
// Versão 2 (11/13/2026): o áudio é a fonte. Grava em pedaços de 1 minuto, cada pedaço sobe e o
// servidor transcreve. A fila fica salva no celular (IndexedDB): recarregar a página não perde nada.
const API = 'https://kalmbgmutbizheziqdcg.supabase.co/functions/v1/desk-gravador';
const EVENTO_PADRAO = 'Five Rings National Trading Camp 2026';
const SEG_MS = 60000;
const $ = (id) => document.getElementById(id);
const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

let CHAVE = null;
const m = location.hash.match(/k=([A-Za-z0-9_\-]+)/);
if (m) { CHAVE = m[1]; LS.set('gravador_chave', CHAVE); history.replaceState(null, '', location.pathname); }
else CHAVE = LS.get('gravador_chave');

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); }
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
async function api(body, isForm){
  const opts = { method:'POST', headers:{ 'x-gravador-chave': CHAVE } };
  if (isForm) opts.body = body; else { opts.headers['content-type']='application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API, opts);
  const j = await r.json().catch(()=>({}));
  if (!r.ok || j.erro) throw new Error(j.erro || ('HTTP '+r.status));
  return j;
}

// ---------- fila salva no celular ----------
let db = null;
function abrirDB(){ return new Promise((res)=>{ try { const r = indexedDB.open('gravador', 1);
  r.onupgradeneeded = ()=> r.result.createObjectStore('fila', { keyPath:'k' });
  r.onsuccess = ()=>{ db = r.result; res(); }; r.onerror = ()=>res(); } catch(e){ res(); } }); }
function dbPut(item){ return new Promise(res=>{ if(!db) return res(); try{ const t=db.transaction('fila','readwrite'); t.objectStore('fila').put(item); t.oncomplete=res; t.onerror=res; }catch(e){res();} }); }
function dbDel(k){ return new Promise(res=>{ if(!db) return res(); try{ const t=db.transaction('fila','readwrite'); t.objectStore('fila').delete(k); t.oncomplete=res; t.onerror=res; }catch(e){res();} }); }
function dbAll(){ return new Promise(res=>{ if(!db) return res([]); try{ const q=db.transaction('fila').objectStore('fila').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); }catch(e){res([]);} }); }

const fila = []; let trabalhando = false;
async function enfileirar(item){ item.k = item.k || (Date.now()+'-'+Math.random().toString(36).slice(2,7)); fila.push(item); await dbPut(item); mostrarFila(); processar(); }
function mostrarFila(){ const n = fila.length; $('stFila').innerHTML = n ? `<span class="warn">${n} envio(s) na fila…</span>` : '<span class="good">Tudo enviado ✓</span>'; }
async function enviar(it){
  if (it.tipo==='texto') return api({acao:'texto', id:it.sessao, texto:it.texto});
  if (it.tipo==='nota') return api({acao:'nota', id:it.sessao, texto:it.texto, importante:it.importante});
  const f = new FormData(); f.append('acao', it.tipo); f.append('id', it.sessao);
  if (it.tipo==='audio'){ f.append('segmento', it.nome); f.append('idioma', it.idioma||'en'); f.append('arquivo', it.blob, 'audio'); }
  else f.append('arquivo', it.blob, 'foto.jpg');
  const j = await api(f, true);
  if (it.tipo==='audio' && j.texto && it.sessao===SESSAO){ textoTela += (textoTela?'\n\n':'')+j.texto; render(); }
  if (it.tipo==='foto'){ const b=document.querySelector(`[data-k="${it.k}"]`); if (b) b.className='done'; }
  return j;
}
async function processar(){
  if (trabalhando) return; trabalhando = true;
  let falhasSeguidas = 0;
  while (fila.length){
    const it = fila.shift();
    try { await enviar(it); await dbDel(it.k); falhasSeguidas = 0; $('net').textContent='online'; $('net').className='good'; }
    catch(e){
      it.tent = (it.tent||0)+1; fila.push(it);              // vai para o fim: um envio com problema não trava os outros
      if (String(e.message).includes('chave')) { toast('Chave inválida'); fila.length && mostrarFila(); break; }
      if (/Failed to fetch|Load failed|NetworkError|HTTP 5/.test(e.message)) { $('net').textContent='sem conexão'; $('net').className='err'; }
      falhasSeguidas++;
      if (falhasSeguidas >= fila.length) { await sleep(Math.min(20000, 3000*falhasSeguidas)); }
    }
    mostrarFila();
  }
  trabalhando = false;
}
setInterval(()=>{ if (fila.length && !trabalhando) processar(); }, 15000);

// ---------- sessões ----------
let SESSAO = LS.get('gravador_sessao');
async function carregarSessoes(selecionar){
  const j = await api({acao:'listar'});
  const sel = $('selSessao'); sel.innerHTML='';
  j.itens.forEach(it=>{ const o=document.createElement('option'); o.value=it.id; o.textContent=it.assunto; sel.appendChild(o); });
  const o=document.createElement('option'); o.value='__nova'; o.textContent='➕ Nova palestra…'; sel.appendChild(o);
  const alvo = selecionar || SESSAO;
  if (alvo && j.itens.some(i=>i.id===alvo)) sel.value = alvo; else if (j.itens[0]) sel.value = j.itens[0].id;
  if (sel.value !== '__nova') { SESSAO = sel.value; LS.set('gravador_sessao', SESSAO); }
  $('net').textContent='online'; $('net').className='good';
}
$('selSessao').onchange = (e)=>{
  if (e.target.value==='__nova'){ $('novaBox').classList.remove('hide'); $('novoEvento').value = EVENTO_PADRAO; $('novoAssunto').focus(); return; }
  if (gravando) trocarSegmento();
  SESSAO = e.target.value; LS.set('gravador_sessao', SESSAO); $('thumbs').innerHTML=''; textoTela=''; render(); toast('Palestra trocada');
};
$('btnCancelNova').onclick = ()=>{ $('novaBox').classList.add('hide'); $('selSessao').value = SESSAO || ''; };
$('btnCriar').onclick = async ()=>{
  const assunto = $('novoAssunto').value.trim(); if (!assunto) return toast('Escreva o assunto');
  $('btnCriar').disabled = true;
  try {
    const j = await api({acao:'nova', assunto, palestrante:$('novoPalestrante').value.trim(), evento:$('novoEvento').value.trim()||EVENTO_PADRAO});
    $('novaBox').classList.add('hide'); $('novoAssunto').value=''; $('novoPalestrante').value='';
    if (gravando) trocarSegmento();
    await carregarSessoes(j.item.id); $('thumbs').innerHTML=''; textoTela=''; render(); toast('Palestra criada ✓');
  } catch(e){ toast('Erro: '+e.message); }
  $('btnCriar').disabled = false;
};

// ---------- tela da transcrição ----------
let textoTela = '';
function render(){ const el=$('live'); el.textContent = textoTela ? textoTela.slice(-5000) : (gravando ? 'Gravando… o texto aparece aqui a cada 1 minuto.' : 'Toque em Gravar. A tela fica ligada enquanto grava.'); el.scrollTop = el.scrollHeight; }

// ---------- gravação em pedaços de 1 minuto ----------
let gravando=false, stream=null, mr=null, partes=[], segTimer=null, wakeLock=null, inicio=0, ultimoPedaco=0;
function tipoAudio(){ for (const t of ['audio/mp4','audio/webm;codecs=opus','audio/webm']) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; return ''; }
async function abrirMicrofone(){
  if (stream && stream.getTracks().every(t=>t.readyState==='live')) return true;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:true, autoGainControl:true}}); return true; }
  catch(e){ toast('Sem acesso ao microfone'); return false; }
}
function novoSegmento(){
  if (!gravando || !stream) return;
  const tipo = tipoAudio(); const sessao = SESSAO; const nome = String(Date.now()); const pedaco = [];
  let rec;
  try { rec = new MediaRecorder(stream, tipo ? {mimeType:tipo, audioBitsPerSecond:48000} : undefined); }
  catch(e){ toast('Erro no gravador: '+e.message); return; }
  rec.ondataavailable = (e)=>{ if (e.data && e.data.size) pedaco.push(e.data); };
  rec.onstop = ()=>{ const blob = new Blob(pedaco, {type: rec.mimeType || 'audio/mp4'});
    if (blob.size > 3000 && sessao) { ultimoPedaco = Date.now(); enfileirar({ tipo:'audio', sessao, nome, blob, idioma: $('selLang').value.slice(0,2) }); } };
  rec.start(1000); mr = rec;
  clearTimeout(segTimer); segTimer = setTimeout(trocarSegmento, SEG_MS);
}
function trocarSegmento(){ const velho = mr; mr = null; if (velho && velho.state!=='inactive'){ try{ velho.stop(); }catch(e){} } if (gravando) novoSegmento(); }
async function manterTelaLigada(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
function status(){
  if (!gravando){ $('stRec').textContent=''; return; }
  const min = Math.floor((Date.now()-inicio)/60000);
  const au = (mr && mr.state==='recording') ? '<span class="good">gravando</span>' : '<span class="warn">gravação parada, toque em Parar e Gravar</span>';
  $('stRec').innerHTML = `<span class="pill">${min} min</span><span class="pill">${au}</span>`;
}
setInterval(status, 5000);

$('btnRec').onclick = async ()=>{
  if (!SESSAO) return toast('Escolha ou crie a palestra primeiro');
  if (!gravando){
    if (!(await abrirMicrofone())) return;
    gravando = true; inicio = Date.now();
    $('btnRec').classList.add('on'); $('btnRec').textContent='■ Parar';
    novoSegmento(); manterTelaLigada(); render(); status();
  } else {
    gravando = false; clearTimeout(segTimer);
    $('btnRec').classList.remove('on'); $('btnRec').textContent='● Gravar';
    const velho = mr; mr = null; if (velho && velho.state!=='inactive') velho.stop();
    setTimeout(()=>{ stream && stream.getTracks().forEach(t=>t.stop()); stream=null; }, 500);
    try{ wakeLock && wakeLock.release(); }catch(e){} status(); toast('Gravação encerrada. Enviando o último pedaço…');
  }
};

// Volta da câmera ou de outro app: religa sozinho
document.addEventListener('visibilitychange', async ()=>{
  if (document.visibilityState!=='visible') return;
  if (fila.length && !trabalhando) processar();
  if (!gravando) return;
  manterTelaLigada();
  if (!mr || mr.state!=='recording' || !stream || stream.getTracks().some(t=>t.readyState!=='live')){
    if (mr && mr.state!=='inactive'){ try{ mr.stop(); }catch(e){} } mr=null;
    stream = null; if (await abrirMicrofone()) novoSegmento();
  }
  status();
});

// ---------- fotos ----------
async function reduzir(file){
  try {
    const img = await createImageBitmap(file);
    const max = 2200, s = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file), 'image/jpeg', 0.85));
  } catch(e){ return file; }
}
async function enviarFotos(files){
  if (!SESSAO) return toast('Escolha ou crie a palestra primeiro');
  for (const file of files){
    const k = Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const box = document.createElement('div'); box.dataset.k = k; const im = document.createElement('img'); im.src = URL.createObjectURL(file); box.appendChild(im); $('thumbs').appendChild(box);
    const blob = await reduzir(file);
    enfileirar({ k, tipo:'foto', sessao:SESSAO, blob });
  }
  toast(files.length>1 ? `${files.length} fotos na fila` : 'Foto na fila ✓');
}
// ---------- câmera dentro do app: a gravação de áudio não para ----------
let camStream = null, camFotos = 0;
function camStatus(){ const ok = gravando && mr && mr.state==='recording';
  $('camRec').innerHTML = gravando ? (ok ? '🔴 Gravação continua' : '⚠️ Gravação parada') : 'Sem gravação'; }
async function abrirCamera(){
  if (!SESSAO) return toast('Escolha ou crie a palestra primeiro');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160} }, audio: gravando });
  } catch(e){ toast('Sem câmera no app, abrindo a câmera do iPhone'); return $('inFoto').click(); }
  // Se o iPhone derrubou o microfone antigo ao abrir a câmera, a gravação passa a usar o microfone desta câmera
  if (gravando){
    const antigoVivo = stream && stream.getAudioTracks().some(t=>t.readyState==='live' && !t.muted);
    const novo = camStream.getAudioTracks()[0];
    if (!antigoVivo && novo){ stream = new MediaStream([novo]); trocarSegmento(); }
    else camStream.getAudioTracks().forEach(t=>{ if (!stream || !stream.getTracks().includes(t)) t.stop(); });
  }
  camFotos = 0; $('camCont').textContent = '0 fotos';
  const v = $('camVideo'); v.srcObject = camStream; $('cam').classList.remove('hide');
  try { await v.play(); } catch(e){}
  camStatus(); camStatus.t = setInterval(camStatus, 2000);
}
function fecharCamera(){
  clearInterval(camStatus.t);
  if (camStream) camStream.getVideoTracks().forEach(t=>t.stop());
  if (camStream && !gravando) camStream.getTracks().forEach(t=>t.stop());
  camStream = null; $('camVideo').srcObject = null; $('cam').classList.add('hide');
  if (gravando && (!mr || mr.state!=='recording')) { abrirMicrofone().then(ok=>{ if (ok) novoSegmento(); }); }
  status();
}
async function capturar(){
  const v = $('camVideo'); if (!v.videoWidth) return toast('Câmera ainda carregando');
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const f = $('flash'); f.style.opacity = '.8'; setTimeout(()=>f.style.opacity='0', 120);
  const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.9)); if (!blob) return toast('Não consegui capturar');
  const k = Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const box = document.createElement('div'); box.dataset.k = k; const im = document.createElement('img'); im.src = URL.createObjectURL(blob); box.appendChild(im); $('thumbs').appendChild(box);
  enfileirar({ k, tipo:'foto', sessao:SESSAO, blob });
  camFotos++; $('camCont').textContent = camFotos + (camFotos===1 ? ' foto' : ' fotos');
}
$('btnFoto').onclick = abrirCamera;
$('btnCapturar').onclick = capturar;
$('camVideo').onclick = capturar;
$('btnFecharCam').onclick = fecharCamera;
$('btnGaleria').onclick = ()=> $('inGaleria').click();
$('inFoto').onchange = (e)=>{ enviarFotos([...e.target.files]); e.target.value=''; };
$('inGaleria').onchange = (e)=>{ enviarFotos([...e.target.files]); e.target.value=''; };

// ---------- notas ----------
function salvarNota(imp){
  const t = $('txtNota').value.trim(); if (!t) return toast('Escreva a nota');
  if (!SESSAO) return toast('Escolha ou crie a palestra primeiro');
  enfileirar({ tipo:'nota', sessao:SESSAO, texto:t, importante:imp });
  $('txtNota').value=''; toast(imp ? 'Nota importante salva ⭐' : 'Nota salva ✓');
}
$('btnNota').onclick = ()=>salvarNota(false);
$('btnNotaImp').onclick = ()=>salvarNota(true);

window.addEventListener('beforeunload', (e)=>{ if (gravando){ e.preventDefault(); e.returnValue=''; } });

(async ()=>{
  if (!CHAVE){ $('semChave').classList.remove('hide'); return; }
  $('app').classList.remove('hide');
  await abrirDB();
  const pendentes = await dbAll(); pendentes.forEach(p=>fila.push(p)); mostrarFila(); render();
  try { await carregarSessoes(); } catch(e){ $('net').textContent = e.message.includes('chave') ? 'chave inválida' : 'sem conexão'; $('net').className='err'; }
  if (fila.length) processar();
})();

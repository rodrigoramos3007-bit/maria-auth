<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Redefinir senha — MAR.IA</title>

<!--
  Página de reset de senha para o login da MAR.IA (extensão do WhatsApp).

  POR QUE ELA EXISTE: o projeto Supabase usado pela MAR.IA é compartilhado
  com o allbridge-ai-os, e o Site URL dele aponta para localhost:3000 (config
  de desenvolvimento). Trocar o Site URL mexeria em fluxos do allbridge-ai-os
  que não são desta extensão. Esta página é só ADICIONADA à lista de
  redirecionamentos permitidos (uri_allow_list) -- não muda o Site URL, não
  afeta nenhum e-mail do outro app.

  COMO FUNCIONA: o Supabase manda o link de recuperação para cá com o token
  de acesso temporário no #fragmento da URL (nunca vai para o servidor --
  fragmento não é enviado em requisição HTTP). O JS lê esse token e troca a
  senha chamando a API do Supabase direto do navegador, com a chave pública
  (anon/publishable -- segura para expor, é assim que toda extensão/app faz).
-->

<style>
  :root { --bg:#0d0d0f; --papel:#f4f2ee; --azul:#2f6fed; --erro:#e2504a; --linha:#232323; }
  * { box-sizing:border-box }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--papel); padding:28px;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  main { width:100%; max-width:360px; text-align:center }
  .marca { font-size:13px; font-weight:600; letter-spacing:.4px; opacity:.6; margin-bottom:24px }
  h1 { font-size:19px; font-weight:500; margin:0 0 8px }
  p { font-size:13px; opacity:.7; margin:0 0 22px; line-height:1.55 }
  input {
    width:100%; background:#161618; border:1px solid var(--linha); color:var(--papel);
    border-radius:8px; padding:12px 13px; font-size:14px; margin-bottom:12px; box-sizing:border-box;
  }
  input:focus { outline:none; border-color:var(--azul) }
  button {
    width:100%; background:var(--azul); color:#fff; border:0; border-radius:9px;
    padding:13px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:default }
  .msg { margin-top:16px; font-size:13px; line-height:1.5 }
  .msg.erro { color:var(--erro) }
  .msg.ok { color:#4ade80 }
</style>
</head>
<body>
<main>
  <div class="marca">MAR.IA · AllBridge Solutions</div>

  <div id="formulario">
    <h1>Redefinir senha</h1>
    <p>Escolha uma senha nova para entrar na extensão.</p>
    <input id="senha" type="password" placeholder="Senha nova" autocomplete="new-password"/>
    <input id="senha2" type="password" placeholder="Confirme a senha nova" autocomplete="new-password"/>
    <button id="salvar">Salvar senha</button>
  </div>

  <div id="feito" style="display:none">
    <h1>Senha alterada</h1>
    <p>Pode fechar esta aba e entrar de novo na extensão do WhatsApp.</p>
  </div>

  <p class="msg" id="msg"></p>
</main>

<script>
  const SUPABASE_URL = "https://kalmbgmutbizheziqdcg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8RcxGVsqMpixzXm-Ba3G8A_i11JuVrl";

  const msg = document.getElementById("msg");
  function mostrar(texto, tipo) { msg.textContent = texto; msg.className = "msg " + tipo; }

  // O fragmento vem como #access_token=...&refresh_token=...&type=recovery
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const accessToken = params.get("access_token");
  const erroUrl = params.get("error_description");

  if (erroUrl) {
    mostrar("Este link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\" na extensão.", "erro");
  } else if (!accessToken) {
    mostrar("Link inválido -- faltou o token. Peça um novo em \"Esqueci minha senha\" na extensão.", "erro");
  }

  const botao = document.getElementById("salvar");
  botao.addEventListener("click", async () => {
    const senha = document.getElementById("senha").value;
    const senha2 = document.getElementById("senha2").value;
    if (!accessToken) return;
    if (senha.length < 6) { mostrar("A senha precisa ter pelo menos 6 caracteres.", "erro"); return; }
    if (senha !== senha2) { mostrar("As duas senhas não são iguais.", "erro"); return; }

    botao.disabled = true;
    mostrar("Salvando…", "");
    try {
      const resp = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: {
          "content-type": "application/json",
          authorization: `Bearer ${accessToken}`,
          apikey: SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ password: senha }),
      });
      if (!resp.ok) {
        const erro = await resp.json().catch(() => ({}));
        mostrar(erro?.msg || erro?.error_description || "Não foi possível salvar. Tente pedir um novo link.", "erro");
        botao.disabled = false;
        return;
      }
      document.getElementById("formulario").style.display = "none";
      document.getElementById("feito").style.display = "block";
      mostrar("", "");
    } catch (e) {
      mostrar("Falha de conexão. Tente de novo.", "erro");
      botao.disabled = false;
    }
  });
</script>
</body>
</html>
